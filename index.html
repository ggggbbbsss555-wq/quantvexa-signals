<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantVexa Signals</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:16px;font-size:14px}
*,*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:#222;border-radius:4px}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#00d2ff 0%,#0099cc 100%);display:grid;place-items:center;font-weight:800;font-size:14px;color:#000}
.brand-text strong{display:block;font-size:15px;font-weight:700}
.brand-text small{color:#666;font-size:11px}
.tg-input{display:flex;align-items:center;gap:6px;background:#141414;border:1px solid #222;border-radius:8px;padding:6px 10px}
.tg-input input{background:transparent;border:none;color:#fff;font-family:inherit;font-size:13px;width:120px;outline:none}
.tg-input label{color:#666;font-size:11px;font-weight:600}

/* Allowance card */
.allowance-card{background:linear-gradient(180deg,#131313 0%,#080808 100%);border:1px solid #1f1f1f;border-radius:14px;padding:18px;margin-bottom:18px}
.allowance-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.allowance-header h2{font-size:14px;font-weight:700}
.level-badge{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.4px}
.level-badge.l0{background:rgba(100,116,139,.15);color:#94a3b8;border:1px solid rgba(100,116,139,.35)}
.level-badge.l1{background:rgba(22,163,74,.15);color:#16a34a;border:1px solid rgba(22,163,74,.35)}
.level-badge.l2{background:rgba(217,119,6,.15);color:#d97706;border:1px solid rgba(217,119,6,.35)}
.level-badge.l3{background:rgba(220,38,38,.15);color:#dc2626;border:1px solid rgba(220,38,38,.35)}
.allowance-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.allowance-stat{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:10px;padding:12px}
.allowance-stat .label{font-size:11px;color:#888;font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.allowance-stat .label .dot{width:8px;height:8px;border-radius:50%}
.allowance-stat .label .dot.normal{background:#00ff88}
.allowance-stat .label .dot.future{background:#ab82ff}
.allowance-stat .value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.allowance-stat .meta{font-size:10px;color:#666;margin-top:4px}
.allowance-stat .used{color:#ffaa00;font-weight:700}

/* Admin controls */
.admin-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:12px;background:#0f0f0f;border:1px solid #1f1f1f;border-radius:10px}
.admin-bar label{font-size:11px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.admin-bar select,.admin-bar input{background:#141414;border:1px solid #222;color:#fff;border-radius:6px;padding:6px 10px;font-family:inherit;font-size:12px;outline:none}
.admin-bar button{background:linear-gradient(135deg,#00d2ff 0%,#0099cc 100%);color:#000;border:none;border-radius:6px;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}

/* Signals list */
.signals-list{display:flex;flex-direction:column;gap:8px}
.signal-card{background:#0d0d0d;border:1px solid #1a1a1a;border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.signal-dir{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:11px;flex-shrink:0}
.signal-dir.BUY{background:rgba(0,255,136,.12);color:#00ff88;border:1px solid rgba(0,255,136,.3)}
.signal-dir.SELL{background:rgba(255,68,102,.12);color:#ff4466;border:1px solid rgba(255,68,102,.3)}
.signal-body{flex:1;min-width:0}
.signal-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.signal-symbol{font-weight:700;font-size:14px}
.signal-type{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.signal-type.normal{background:rgba(0,255,136,.1);color:#00ff88}
.signal-type.future{background:rgba(171,130,255,.1);color:#ab82ff}
.signal-result{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase}
.signal-result.win{background:rgba(0,255,136,.15);color:#00ff88}
.signal-result.loss{background:rgba(255,68,102,.15);color:#ff4466}
.signal-result.pending{background:rgba(255,170,0,.12);color:#ffaa00}
.signal-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:#666;flex-wrap:wrap}
.signal-meta .countdown{font-variant-numeric:tabular-nums;font-weight:700}
.signal-meta .countdown.urgent{color:#ff4466}
.signal-meta .countdown.warn{color:#ffaa00}
.signal-meta .time{color:#444}
.signal-meta .profit{font-weight:700}
.signal-meta .profit.win{color:#00ff88}
.signal-meta .profit.loss{color:#ff4466}

.empty{text-align:center;padding:40px 20px;color:#444;font-size:13px}
.refresh-bar{position:fixed;bottom:12px;right:12px;background:#0d0d0d;border:1px solid #222;border-radius:20px;padding:6px 12px;font-size:11px;color:#666;display:flex;align-items:center;gap:6px}
.refresh-bar .pulse{width:6px;height:6px;border-radius:50%;background:#00ff88;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-logo">QV</div>
    <div class="brand-text">
      <strong>QuantVexa Signals</strong>
      <small>All times in UTC (candle timezone)</small>
    </div>
  </div>
  <div class="tg-input">
    <label>TG ID</label>
    <input type="text" id="tgIdInput" placeholder="123456789" value="123456789">
  </div>
</div>

<div class="allowance-card">
  <div class="allowance-header">
    <h2>Your Daily Allowance</h2>
    <div id="levelBadge" class="level-badge l0">Normal Users</div>
  </div>
  <div class="allowance-grid">
    <div class="allowance-stat">
      <div class="label"><span class="dot normal"></span>Normal Signals</div>
      <div class="value" id="normalValue">5 / day</div>
      <div class="meta">Used today: <span class="used" id="normalUsed">0</span></div>
    </div>
    <div class="allowance-stat">
      <div class="label"><span class="dot future"></span>Future Signals</div>
      <div class="value" id="futureValue">0 / day</div>
      <div class="meta">Used today: <span class="used" id="futureUsed">0</span></div>
    </div>
  </div>
</div>

<div class="admin-bar">
  <label>Admin:</label>
  <label>Set level</label>
  <select id="levelSelect">
    <option value="0">Level 0 (Normal)</option>
    <option value="1">Level 1 (Pro)</option>
    <option value="2">Level 2 (Pro+)</option>
    <option value="3">Level 3 (Elite)</option>
  </select>
  <button onclick="setLevel()">Apply</button>
  <label style="margin-left:8px">Normal/day</label>
  <input type="number" id="cfgNormal" min="0" max="1000" style="width:70px">
  <label>Future/day</label>
  <input type="number" id="cfgFuture" min="0" max="1000" style="width:70px">
  <button onclick="saveConfig()">Save Config</button>
</div>

<div class="signals-list" id="signalsList">
  <div class="empty">Loading signals…</div>
</div>

<div class="refresh-bar"><span class="pulse"></span> Auto-refresh 3s</div>

<script>
// =====================================================================
// QuantVexa Signals — Frontend
// All timestamps displayed in UTC (candle timezone).
// =====================================================================
const API_BASE = window.location.origin; // same origin as server

function $(id) { return document.getElementById(id); }
function tgId() { return $('tgIdInput').value.trim() || '0'; }

// Format a Unix-second timestamp as HH:MM UTC
function fmtTime(sec) {
  const d = new Date(sec * 1000);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
}
// Countdown from now (UTC) to a target Unix-second timestamp
function fmtCountdown(targetSec) {
  const now = Math.floor(Date.now() / 1000);
  const r = targetSec - now;
  if (r <= 0) return 'expired';
  const m = Math.floor(r / 60);
  const s = r % 60;
  return m + ':' + String(s).padStart(2,'0');
}

// Fetch JSON helper
async function getJSON(path) {
  try {
    const r = await fetch(API_BASE + path);
    const j = await r.json();
    return j.ok ? j.data : null;
  } catch (e) { return null; }
}
async function putJSON(path, body) {
  try {
    const r = await fetch(API_BASE + path, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    return j.ok ? j.data : null;
  } catch (e) { return null; }
}
async function postJSON(path, body) {
  try {
    const r = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    return j.ok ? j.data : null;
  } catch (e) { return null; }
}

// ---- Render allowance card ----
function renderAllowance(a) {
  if (!a) return;
  const badge = $('levelBadge');
  badge.className = 'level-badge l' + a.level;
  badge.textContent = a.label;
  $('normalValue').textContent = a.normalSignals + ' / day';
  $('futureValue').textContent = a.futureSignals + ' / day';
  $('normalUsed').textContent = a.usedNormalToday;
  $('futureUsed').textContent = a.usedFutureToday;
}

// ---- Render signal cards ----
function renderSignals(data) {
  const list = $('signalsList');
  if (!data || !data.signals || data.signals.length === 0) {
    list.innerHTML = '<div class="empty">No signals yet — waiting for generator…</div>';
    return;
  }
  list.innerHTML = data.signals.map(s => {
    const expired = Math.floor(Date.now() / 1000) >= s.expiry;
    const cd = fmtCountdown(s.expiry);
    let cdClass = '';
    if (!expired) {
      const r = s.expiry - Math.floor(Date.now() / 1000);
      if (r <= 30) cdClass = 'urgent';
      else if (r <= 60) cdClass = 'warn';
    }
    const resultBadge = s.result
      ? `<span class="signal-result ${s.result}">${s.result}</span>`
      : `<span class="signal-result pending">pending</span>`;
    const profitStr = s.profit !== null
      ? `<span class="profit ${s.result}">${s.profit > 0 ? '+' : ''}${s.profit}</span>`
      : '';
    return `
      <div class="signal-card">
        <div class="signal-dir ${s.direction}">${s.direction}</div>
        <div class="signal-body">
          <div class="signal-top">
            <span class="signal-symbol">${s.symbol}</span>
            <span class="signal-type ${s.type}">${s.type}</span>
            ${resultBadge}
          </div>
          <div class="signal-meta">
            <span class="time">Start ${fmtTime(s.startTime)} UTC</span>
            <span class="countdown ${cdClass}">${expired ? 'expired' : '⏱ ' + cd}</span>
            <span class="time">Dur ${s.duration}s</span>
            ${profitStr}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ---- Poll allowance + signals ----
async function refresh() {
  const id = tgId();
  const [allowance, signalsData] = await Promise.all([
    getJSON('/api/me/allowance?tg_id=' + encodeURIComponent(id)),
    getJSON('/api/signals?tg_id=' + encodeURIComponent(id) + '&limit=30'),
  ]);
  renderAllowance(allowance);
  renderSignals(signalsData);
}

// ---- Admin actions ----
async function setLevel() {
  const level = parseInt($('levelSelect').value, 10);
  await postJSON('/api/admin/users/' + encodeURIComponent(tgId()) + '/promote', { level });
  refresh();
}
async function saveConfig() {
  const level = parseInt($('levelSelect').value, 10);
  const levelKey = 'level' + level;
  const normal = parseInt($('cfgNormal').value, 10);
  const future = parseInt($('cfgFuture').value, 10);
  if (isNaN(normal) || isNaN(future)) {
    alert('Enter valid numbers for normal and future');
    return;
  }
  await putJSON('/api/admin/signal-config/' + levelKey, { normalSignals: normal, futureSignals: future });
  // Pre-fill with the just-saved values
  refresh();
}

// Pre-fill admin inputs from current config
async function loadConfigIntoAdminBar() {
  const cfg = await getJSON('/api/admin/signal-config');
  if (!cfg) return;
  const level0 = cfg.level0;
  $('cfgNormal').value = level0.normalSignals;
  $('cfgFuture').value = level0.futureSignals;
}

// When admin changes the selected level, pre-fill that level's current values
$('levelSelect').addEventListener('change', async () => {
  const level = parseInt($('levelSelect').value, 10);
  const cfg = await getJSON('/api/admin/signal-config');
  if (!cfg) return;
  const c = cfg['level' + level];
  if (c) {
    $('cfgNormal').value = c.normalSignals;
    $('cfgFuture').value = c.futureSignals;
  }
});

// Re-render countdowns every second (without refetching)
setInterval(() => {
  document.querySelectorAll('.signal-card').forEach(card => {
    // Find the signal id from the rendered HTML — but easier: just refresh countdown text from data attribute
  });
  // Cheap approach: just re-render from last fetched data
  if (window._lastSignalsData) renderSignals(window._lastSignalsData);
}, 1000);
// Stash last data
const origRender = renderSignals;
renderSignals = function(d) { window._lastSignalsData = d; origRender(d); };

// Initial load + 3s polling
loadConfigIntoAdminBar();
refresh();
setInterval(refresh, 3000);
</script>

</body>
</html>
